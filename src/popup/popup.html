<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <title>日文歌詞羅馬拼音</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header class="header">
    <h1 class="title">Romaji</h1>
    <p class="subtitle">Spotify 網頁版</p>
  </header>

  <section class="field">
    <span class="field-label">顯示方式</span>
    <div class="modes" id="modes" role="radiogroup" aria-label="顯示方式"></div>
  </section>

  <section class="field">
    <label class="field-label" for="offset">
      延遲校正 <output class="field-value" id="offset-value"></output>
    </label>
    <!-- min/max/step 由 popup.js 從 settings.js 帶入,不在這裡寫死第二份 -->
    <input class="slider" type="range" id="offset" aria-describedby="offset-hint" />
    <div class="nudge" role="group" aria-label="以 0.5 秒為單位調整提前量">
      <button type="button" class="nudge-btn" id="offset-later" data-delta="-500">
        − 0.5 秒
        <span class="nudge-sub"></span>
      </button>
      <button type="button" class="nudge-btn" id="offset-earlier" data-delta="500">
        ＋ 0.5 秒
        <span class="nudge-sub"></span>
      </button>
    </div>
    <p class="field-hint" id="offset-hint"></p>
  </section>

  <section class="field">
    <label class="field-label" for="scale">
      拼音外觀 <output class="field-value" id="scale-value"></output>
    </label>
    <div class="appearance">
      <input type="color" id="color" aria-label="拼音顏色" />
      <div class="swatches" role="group" aria-label="常用顏色">
        <button type="button" class="swatch" data-color="#1db954" title="Spotify 綠"></button>
        <button type="button" class="swatch" data-color="#ffffff" title="白"></button>
        <button type="button" class="swatch" data-color="#ffd479" title="淡黃"></button>
        <button type="button" class="swatch" data-color="#7dd3fc" title="淺藍"></button>
        <button type="button" class="swatch" data-color="#f9a8d4" title="粉紅"></button>
        <button type="button" class="swatch" data-color="#000000" title="黑"></button>
      </div>
    </div>
    <input class="slider" type="range" id="scale" />
    <p class="field-hint">左邊方塊可自己挑色,滑桿調大小</p>
  </section>

  <section class="field">
    <span class="field-label">
      自訂讀音 <output class="field-value" id="corrections-count"></output>
    </span>
    <ul class="corrections" id="corrections"></ul>
    <p class="field-error" id="corrections-error" role="alert"></p>
    <p class="field-hint">歌詞上雙擊拼音可修正讀音,紅色波浪底線的字點一下就能補</p>
  </section>

  <!--
      頁尾拿掉了。「設定會立即套用」是預設期待,講出來反而讓人懷疑
      是不是有哪些不會立即套用;而使用者調滑桿時看畫面就知道了。
    -->

  <script src="popup.js"></script>
</body>

</html>
